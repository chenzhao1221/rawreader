<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overlay Sample - Chapter 1 - Example Reader</title>
  <style>
    body{margin:0;background:#222}
    .stage{position:relative;width:900px;margin:0 auto 20px}
    .stage img{display:block;width:900px}
    .tap{position:absolute;inset:0;background:transparent;cursor:pointer}
  </style>
</head>
<body>
  <!-- Synthetic page: a fully transparent flip layer over the picture, then the same kind of picture inside a link. -->
  <div class="stage" id="layered"><img src="img/page-1200x1700.png?v=layer"><div class="tap" id="tap"></div></div>
  <div class="stage" id="linked"><a href="#next"><img src="img/page-1200x1700.png?v=link"></a></div>
</body>
</html>
